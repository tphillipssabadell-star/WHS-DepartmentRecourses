<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="book.css"/>
	<title>Department Catalogue</title>

</head>
<body>
	
	<header>
		<img class="WHS_logo" src="header-logo.png" width="30" height="30" alt="WHS logo">
		<h3>WHS Resource Catalouge</h3>
	</header>
	
	<div class="main">
	<h1>Book Index</h1>
	
	<h2>Westland high schools history, classics and english offial book catalouge</h2>
	
<table id="bookTable" class="display">
		<thead>
			<tr>
				<th>Author</th>
				<th>Title</th>
				<th>No of copies</th>
				<th>Current location</th>
				<th>Year 7-8</th>
				<th>Year 9-10</th>
				<th>Year 11</th>
				<th>Year 12</th>
				<th>Year 13</th>
				<th>Teaching Resources</th>
			</tr>
		</thead> 
	</table>

	<script type="text/javascript" src="https://cdn.datatables.net/3.1.3/js/dataTables.min.js"></script> 
	<script>
		new DataTable('#bookTable', {
			ajax: 'https://script.google.com/macros/s/AKfycbw5pHnziHrynThfJxdCgWANJtUJv3AzJEcOOotgY8Qx-RTlN1LQ4PG7RH4cBgw8_zKu/exec',
			columns: [
				{ data: 'Author' },
				{ data: 'Title' },
				{ data: 'No of copies' },
				{ data: 'Current location' },
				{ data: 'Year 7-8' },
				{ data: 'Year 9-10' },
				{ data: 'Year 11' },
				{ data: 'Year 12' },
				{ data: 'Year 13' },
				{ data: 'Teaching Resources',
					render: function (data) {
						if (!data) return '';
						return '<a href="' + data + '" target="_blank" rel="noopener">Open</a>';
					}
				}
			]
		});
	</script>
</body>
</html>
