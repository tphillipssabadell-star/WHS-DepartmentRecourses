<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="book.css"/>
	<title>Department Catalogue</title>
</head>
<body>
	
	<!-- The header -->
	<header>
		<img class="WHS_logo" src="header-logo.png" width="30" height="30" alt="WHS logo">
		<h3>WHS Resource Catalouge</h3>
	</header>
	
	<div class="main">
	<h1>Book Index</h1>
	
	<h2>Westland high schools history, classics and english offial book catalouge</h2>
	
	<!-- The table -->
	<table id="bookTable" class="display">
		<thead>
			<tr>
				<th>Author</th>
				<th>Title</th>
				<th>No of copies</th>
				<th>Current location</th>
				<th>Year 7-8</th>
				<th>Year 9-10</th>
				<th>Year 11</th>
				<th>Year 12</th>
				<th>Year 13</th>
				<th>Teaching Resources</th>
			</tr>
		</thead> 
	</table>
	
	<!-- Javascript scripts -->
	
	<script type="text/javascript" src="https://cdn.datatables.net/3.1.3/js/dataTables.min.js"></script> 
	<script type="text/javascript" src="catalouge.js"></script> 

</body>
</html>
